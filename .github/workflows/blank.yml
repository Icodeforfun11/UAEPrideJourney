name: Build apps

on:
  push:
  workflow_dispatch:

jobs:
  ios:
    name: iOS (.ipa for Sideloadly)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -oq project-files.zip
      - name: Build the app (unsigned, Sideloadly signs it)
        run: |
          xcodebuild -project ios/UAEPrideJourney.xcodeproj -target UAEPrideJourney \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package as .ipa
        run: |
          APP="ios/build/Release-iphoneos/UAEPrideJourney.app"
          test -f "$APP/www/index.html"
          mkdir -p out/Payload && cp -R "$APP" out/Payload/
          cd out && zip -qry UAEPrideJourney.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: UAEPrideJourney-iOS
          path: out/UAEPrideJourney.ipa

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -oq project-files.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: UAEPrideJourney-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
